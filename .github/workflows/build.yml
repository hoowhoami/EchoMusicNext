name: Build EchoMusicNext Desktop
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Version contract build tools
        run: python -m pip install cmake==4.4.4
      - name: Validate release version and matrix
        id: release
        run: |
          echo "version=$(node tools/release/contract.mjs version)" >> "$GITHUB_OUTPUT"
          echo "matrix=$(node tools/release/contract.mjs matrix)" >> "$GITHUB_OUTPUT"
      - name: Prepare current-version release notes
        run: node tools/release/changelog.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: build/release-notes/CHANGELOG.md
          if-no-files-found: error
          retention-days: 7
  build:
    needs: prepare
    name: Build (${{ matrix.platform }} ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      ECHO_CHANGELOG_FILE: ${{ github.workspace }}/build/release-notes/CHANGELOG.md
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: native-v1-${{ matrix.runner }}-${{ matrix.arch }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: build/release-notes
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Build tools
        run: python -m pip install cmake==4.4.4 ninja==1.13.0
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          xargs -a tools/qt/linux-packages.txt sudo apt-get install -y
          pkg-config --modversion libpipewire-0.3 libspa-0.2 alsa libpulse
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo gem install fpm -v 1.17.0 --no-document
      - name: Windows packaging tools
        if: runner.os == 'Windows'
        run: choco install nsis --version=3.11 -y --no-progress
      - name: Rust toolchain
        shell: bash
        run: |
          if ! rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy; then
            # Runner images can contain incomplete component installs. Reset
            # only this toolchain; keep Cargo registries and build caches.
            rustup toolchain uninstall 1.99.0
            rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          fi
          rustup run 1.99.0 rustc --version
          rustup run 1.99.0 cargo --version
          rustup run 1.99.0 rustfmt --version
          rustup run 1.99.0 cargo clippy --version
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}-${{ matrix.arch }}-${{ hashFiles('tools/qt/linux-packages.txt') }}
          cache-on-failure: true
      - name: Rust static analysis
        run: node tools/release/rust-check.mjs lint-production
      - name: FFI header check
        run: cargo run --release --locked -p ffi-header -- --check
      - name: Restore pinned Qt SDK
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/qt-official
          key: qt-prebuilt-6.12.0-${{ matrix.runner }}-${{ matrix.arch }}-${{ hashFiles('scripts/qt_sdk.py', 'scripts/qt_download.py', 'scripts/install-qt.py', 'scripts/build-qt.py', 'tools/qt/requirements.txt', 'tools/qt/linux-packages.txt', 'tools/release/licenses.mjs', 'tools/release/qt-licenses.mjs', 'tools/release/license-files.mjs') }}
      - name: Prepare and validate official SDK
        run: python scripts/install-qt.py
      # Save only a validated SDK, before an unrelated compile/package failure.
      - name: Save validated Qt SDK
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/qt-official
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}
      - name: SDK runtime path
        shell: bash
        run: |
          python -c "from scripts.qt_sdk import preferred_prefix; import os; p=preferred_prefix(); open(os.environ['GITHUB_PATH'], 'a').write(str(p / 'bin') + '\n'); open(os.environ['GITHUB_ENV'], 'a').write('QT_PREFIX=' + p.as_posix() + '\n')"
      - name: Set up C and C++ compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: 'v0.16.0'
      - name: Configure
        shell: bash
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: python scripts/build.py --preset release --configure-only --distribution --no-tests
      - name: Build
        run: cmake --build --preset release
      - name: QML lint
        run: cmake --build build/release --target all_qmllint
      - name: Prepare deployment materials
        run: node tools/release/prepare.mjs
      - name: Package
        shell: bash
        run: node tools/release/package.mjs --arch=${{ matrix.arch }} "--qt=$QT_PREFIX" --linuxdeploy=build/release-tools/linuxdeploy-${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/packages/*
          if-no-files-found: error
          retention-days: 7
  release:
    needs: [prepare, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      ECHO_CHANGELOG_FILE: ${{ github.workspace }}/build/release-notes/CHANGELOG.md
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: build/release-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: build/release-assets
      - name: Validate complete release
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node tools/release/contract.mjs validate build/release-assets "$RELEASE_VERSION"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/publish.mjs
